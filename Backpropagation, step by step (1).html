<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backpropagation, step by step</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=STIX+Two+Text:ital@0;1&display=swap">
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#14202b;--mute:#5d6b78;--line:#cfd7df;--fwd:#0b7a75;--err:#a86a00;--bwd:#b3237a;--upd:#4f3fc9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--panel:#18212b;--ink:#e6edf3;--mute:#9aa8b5;--line:#2b3846;--fwd:#3ccfc4;--err:#f0b64a;--bwd:#f06bb5;--upd:#9d90ff}}
:root[data-theme="dark"]{--bg:#10161d;--panel:#18212b;--ink:#e6edf3;--mute:#9aa8b5;--line:#2b3846;--fwd:#3ccfc4;--err:#f0b64a;--bwd:#f06bb5;--upd:#9d90ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
h1{font:600 1.5rem "Instrument Sans",sans-serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
svg{width:100%;height:auto;display:block}
.edge{stroke:var(--line);stroke-width:2;fill:none}
.edge.on{stroke:var(--hl);stroke-width:3.5}
.node circle{fill:var(--panel);stroke:var(--mute);stroke-width:2}
.node.on circle{stroke:var(--hl);stroke-width:4}
.node text{fill:var(--ink);font:600 15px "Instrument Sans",sans-serif;text-anchor:middle}
.val{font:12px "STIX Two Text",serif;fill:var(--mute);text-anchor:middle}
.wl{font:11px "STIX Two Text",serif;fill:var(--mute);text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chips button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:600 .85rem "Instrument Sans",sans-serif;cursor:pointer}
.chips button.cur{background:var(--hl);border-color:var(--hl);color:#fff}
.chips button.done{border-color:var(--hl)}
button:focus-visible,input:focus-visible{outline:3px solid var(--upd);outline-offset:2px}
.phase{display:inline-block;font-weight:600;font-size:.85rem;color:var(--hl);border:1.5px solid var(--hl);border-radius:999px;padding:1px 10px;margin-bottom:6px}
h2{font:600 1.2rem "Instrument Sans",sans-serif;margin:4px 0 6px}
.say{border-left:4px solid var(--hl);padding:2px 0 2px 10px;margin:8px 0 12px;font-style:italic;font-family:"STIX Two Text",serif;font-size:1.05rem}
.lbl{font-size:.8rem;color:var(--mute);margin:12px 0 2px}
.eq{font:1.12rem/1.9 "STIX Two Text",Georgia,serif;overflow-x:auto;padding:2px 0}
.eq.num{background:color-mix(in srgb,var(--hl) 9%,transparent);border-radius:6px;padding:4px 10px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .2em;line-height:1.3}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em}
.fr>span:last-child{padding:0 .25em}
sub,sup{line-height:0}
.nav{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.nav button{font:600 .95rem "Instrument Sans",sans-serif;padding:8px 16px;border-radius:8px;border:1.5px solid var(--hl);background:var(--panel);color:var(--ink);cursor:pointer}
.nav button.p{background:var(--hl);color:#fff}
.nav button:disabled{opacity:.35;cursor:default}
.ctl{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:.9rem;color:var(--mute)}
.ctl label{display:flex;align-items:center;gap:8px}
.ctl b{color:var(--ink);min-width:2.2em}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin-top:8px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{font:600 .95rem "Instrument Sans",sans-serif;padding:8px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{font:inherit;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.dv{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.dv summary{font-weight:600;cursor:pointer;color:var(--hl)}
.dt{margin:8px 0 0;color:var(--mute);font-size:.92rem}
.dv .eq{font-size:1.05rem;line-height:1.7}
[hidden]{display:none!important}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tabs button,.pick button{font:600 .95rem "Instrument Sans",sans-serif;padding:8px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"],.pick button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.c2s{margin-bottom:14px}
.c2s h2{color:var(--hl)}
.c2s.fwd{--hl:var(--fwd)}.c2s.err{--hl:var(--err)}.c2s.bwd{--hl:var(--bwd)}.c2s.upd{--hl:var(--upd)}
.c2s ul{margin:6px 0 0;padding-left:20px}
.c2s .eq{font-size:1.08rem}
.c2 table{border-collapse:collapse;width:100%;font-size:.92rem;margin:8px 0}
.c2 td,.c2 th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
.c2 td:nth-child(2),.c2 td:nth-child(3){font-family:"STIX Two Text",serif;font-size:1.02rem}
</style>
</head>
<body>
<main>
<h1>Backpropagation, one neuron part at a time</h1>
<p class="sub">A 2-2-1 network with sigmoid neurons and one training example. Step through it and every number is computed live.</p>
<div class="tabs" role="tablist"><button id="t1" role="tab" aria-selected="true">Full walkthrough</button><button id="t2" role="tab" aria-selected="false">Case 2: hidden neuron</button><button id="t3" role="tab" aria-selected="false">Activation functions</button></div>
<div class="ctl" style="margin:0 0 14px">
  <label>Learning rate η <input type="range" id="eta" min="0.1" max="2" step="0.1" value="0.5"><b id="etaV"></b></label>
  <label>Target d <input type="range" id="tgt" min="0" max="1" step="0.1" value="1"><b id="tgtV"></b></label>
</div>
<div class="grid" id="v1">
  <div>
    <div class="box">
      <svg viewBox="0 0 520 330" role="img" aria-label="Network with two inputs, two hidden neurons and one output neuron" id="net"></svg>
      <div class="leg"><span><i style="background:var(--fwd)"></i>forward</span><span><i style="background:var(--err)"></i>error</span><span><i style="background:var(--bwd)"></i>backward</span><span><i style="background:var(--upd)"></i>weight update</span></div>
    </div>
  </div>
  <div class="box" id="panel">
    <div class="chips" id="chips" role="tablist" aria-label="Steps"></div>
    <div id="body"></div>
    <div class="nav"><button id="prev">Back</button><button id="next" class="p">Next step</button><span class="sub" id="pos" style="margin:0"></span></div>
  </div>
</div>
<div id="v2" class="c2" hidden></div>
<div id="v3" class="c2" hidden></div>
</main>
<script>
const sig=v=>1/(1+Math.exp(-v));
const N=(v,k=4)=>(v<0?'\u2212':'')+Math.abs(v).toFixed(k);
const P=(v,k=4)=>v<0?'('+N(v,k)+')':N(v,k);
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const X=[1,0.5], H0=[[0.5,-0.3,0.1],[0.4,0.2,-0.1]], O0=[0.6,-0.5,0.2];

function calc(eta,d){
  const vh=H0.map(r=>r[0]*X[0]+r[1]*X[1]+r[2]), yh=vh.map(sig);
  const vo=O0[0]*yh[0]+O0[1]*yh[1]+O0[2], yo=sig(vo), e=d-yo, E=.5*e*e;
  const dO=e*yo*(1-yo), dH=yh.map((y,j)=>y*(1-y)*dO*O0[j]);
  const nO=[O0[0]+eta*dO*yh[0],O0[1]+eta*dO*yh[1],O0[2]+eta*dO];
  const nH=H0.map((r,j)=>[r[0]+eta*dH[j]*X[0],r[1]+eta*dH[j]*X[1],r[2]+eta*dH[j]]);
  const vh2=nH.map(r=>r[0]*X[0]+r[1]*X[1]+r[2]), yh2=vh2.map(sig);
  const vo2=nO[0]*yh2[0]+nO[1]*yh2[1]+nO[2], yo2=sig(vo2), e2=d-yo2, E2=.5*e2*e2;
  return {eta,d,vh,yh,vo,yo,e,E,dO,dH,nO,nH,yo2,e2,E2};
}

const steps=[
c=>({ph:'Setup',cls:'fwd',t:'What we are given',
 say:'Each weight changes by learning rate × local gradient × the input on that weight.',
 g:[`ε = ${F(1,2)} Σ<sub>j</sub> e<sub>j</sub>²`,`Δw<sub>ji</sub> = η · δ<sub>j</sub> · y<sub>i</sub>`],
 n:[`Inputs: x<sub>1</sub> = 1, x<sub>2</sub> = 0.5, target d = ${c.d}, η = ${c.eta}`,
    `Hidden h<sub>1</sub>: w = (0.5, \u22120.3), b = 0.1 \u2003 h<sub>2</sub>: w = (0.4, 0.2), b = \u22120.1`,
    `Output o: w = (0.6, \u22120.5), b = 0.2 \u2003 φ(v) = ${F(1,'1 + e<sup>\u2212v</sup>')}`],hi:[]}),
c=>({ph:'Forward',cls:'fwd',t:'Hidden layer: induced local field v',
 say:'Weighted sum of the inputs plus the bias.',
 g:[`v<sub>j</sub> = Σ<sub>i</sub> w<sub>ji</sub> x<sub>i</sub> + b<sub>j</sub>`],
 n:[`v<sub>1</sub> = 0.5(1) + (\u22120.3)(0.5) + 0.1 = <b>${N(c.vh[0])}</b>`,`v<sub>2</sub> = 0.4(1) + 0.2(0.5) + (\u22120.1) = <b>${N(c.vh[1])}</b>`],
 hi:['x1','x2','h1','h2','x1-h1','x1-h2','x2-h1','x2-h2']}),
c=>({ph:'Forward',cls:'fwd',t:'Hidden layer: activation y',
 say:'Pass v through the sigmoid to get the neuron\u2019s output.',
 g:[`y<sub>j</sub> = φ(v<sub>j</sub>) = ${F(1,'1 + e<sup>\u2212v<sub>j</sub></sup>')}`],
 n:[`y<sub>1</sub> = ${F(1,'1 + e<sup>'+N(-c.vh[0])+'</sup>')} = <b>${N(c.yh[0])}</b>`,`y<sub>2</sub> = ${F(1,'1 + e<sup>'+N(-c.vh[1])+'</sup>')} = <b>${N(c.yh[1])}</b>`],
 hi:['h1','h2']}),
c=>({ph:'Forward',cls:'fwd',t:'Output neuron: induced local field v',
 say:'The hidden outputs become the inputs of the output neuron.',
 g:[`v<sub>o</sub> = Σ<sub>j</sub> w<sub>oj</sub> y<sub>j</sub> + b<sub>o</sub>`],
 n:[`v<sub>o</sub> = 0.6(${N(c.yh[0])}) + (\u22120.5)(${N(c.yh[1])}) + 0.2 = <b>${N(c.vo)}</b>`],
 hi:['h1','h2','o','h1-o','h2-o']}),
c=>({ph:'Forward',cls:'fwd',t:'Output neuron: activation y',
 say:'The sigmoid of v<sub>o</sub> is the network\u2019s output.',
 g:[`y<sub>o</sub> = φ(v<sub>o</sub>)`],
 n:[`y<sub>o</sub> = ${F(1,'1 + e<sup>'+N(-c.vo)+'</sup>')} = <b>${N(c.yo)}</b>`],hi:['o']}),
c=>({ph:'Error',cls:'err',t:'Error and error energy',
 say:'Error is desired minus actual. The \u00bd is there so the derivative comes out clean.',
 g:[`e = d \u2212 y<sub>o</sub>`,`ε = ${F(1,2)} e²`],
 n:[`e = ${c.d} \u2212 ${N(c.yo)} = <b>${N(c.e)}</b>`,`ε = ${F(1,2)}(${N(c.e)})² = <b>${N(c.E,5)}</b>`],hi:['o']}),
c=>({ph:'Backward',cls:'bwd',t:'Output neuron: local gradient δ',
 say:'Output δ is the error times the slope of the activation. For a sigmoid, φ\u2032(v) = y(1\u2212y).',
 g:[`δ<sub>o</sub> = e · φ\u2032(v<sub>o</sub>) = e · y<sub>o</sub>(1 \u2212 y<sub>o</sub>)`],
 n:[`δ<sub>o</sub> = ${P(c.e)} · ${N(c.yo)}(1 \u2212 ${N(c.yo)}) = <b>${N(c.dO,5)}</b>`],hi:['o']}),
c=>({ph:'Backward',cls:'bwd',t:'Hidden neurons: local gradient δ',
 say:'A hidden neuron has no target, so it borrows the next layer\u2019s δ through the weights that connect them. Use the old weights.',
 g:[`δ<sub>j</sub> = φ\u2032(v<sub>j</sub>) · Σ<sub>k</sub> δ<sub>k</sub> w<sub>kj</sub> = y<sub>j</sub>(1 \u2212 y<sub>j</sub>) · δ<sub>o</sub> w<sub>oj</sub>`],
 n:[`δ<sub>1</sub> = ${N(c.yh[0])}(1 \u2212 ${N(c.yh[0])}) · ${P(c.dO,5)} · 0.6 = <b>${N(c.dH[0],5)}</b>`,`δ<sub>2</sub> = ${N(c.yh[1])}(1 \u2212 ${N(c.yh[1])}) · ${P(c.dO,5)} · (\u22120.5) = <b>${N(c.dH[1],5)}</b>`],
 hi:['o','h1','h2','h1-o','h2-o']}),
c=>({ph:'Update',cls:'upd',t:'Update the output-layer weights',
 say:'Learning rate × δ of this neuron × the input on that weight. The bias input is 1.',
 g:[`Δw<sub>oj</sub> = η δ<sub>o</sub> y<sub>j</sub> \u2003 Δb<sub>o</sub> = η δ<sub>o</sub>`,`w ← w + Δw`],
 n:[`w<sub>o1</sub>: 0.6 + ${c.eta}(${P(c.dO,5)})(${N(c.yh[0])}) = <b>${N(c.nO[0])}</b>`,`w<sub>o2</sub>: \u22120.5 + ${c.eta}(${P(c.dO,5)})(${N(c.yh[1])}) = <b>${N(c.nO[1])}</b>`,`b<sub>o</sub>: 0.2 + ${c.eta}(${P(c.dO,5)}) = <b>${N(c.nO[2])}</b>`],
 hi:['h1-o','h2-o','o']}),
c=>({ph:'Update',cls:'upd',t:'Update the hidden-layer weights',
 say:'Same rule. Only δ and the input change: here the input is x<sub>i</sub>.',
 g:[`Δw<sub>ji</sub> = η δ<sub>j</sub> x<sub>i</sub> \u2003 Δb<sub>j</sub> = η δ<sub>j</sub>`],
 n:[`h<sub>1</sub>: w = (<b>${N(c.nH[0][0])}</b>, <b>${N(c.nH[0][1])}</b>), b = <b>${N(c.nH[0][2])}</b>`,`h<sub>2</sub>: w = (<b>${N(c.nH[1][0])}</b>, <b>${N(c.nH[1][1])}</b>), b = <b>${N(c.nH[1][2])}</b>`,`e.g. w<sub>11</sub> = 0.5 + ${c.eta}(${P(c.dH[0],5)})(1)`],
 hi:['x1-h1','x2-h1','x1-h2','x2-h2','h1','h2']}),
c=>({ph:'Check',cls:'fwd',t:'Run the forward pass again',
 say:'If the update worked, the output moves toward the target and ε drops.',
 g:[`ε<sub>new</sub> < ε<sub>old</sub>`],
 n:[`y<sub>o</sub>: ${N(c.yo)} \u2192 <b>${N(c.yo2)}</b>`,`e: ${N(c.e)} \u2192 <b>${N(c.e2)}</b>`,`ε: ${N(c.E,5)} \u2192 <b>${N(c.E2,5)}</b>`],
 hi:['x1','x2','h1','h2','o','x1-h1','x1-h2','x2-h1','x2-h2','h1-o','h2-o']})
];

const dEdw=(a,b)=>`${F('∂ε','∂'+a)}`;
const DV=[
[`~Goal: make ε small. The gradient points uphill, so move each weight the opposite way:`,
 `Δw<sub>ji</sub> = \u2212η ${F('∂ε','∂w<sub>ji</sub>')}`,
 `~Weight w<sub>ji</sub> changes v<sub>j</sub>, which changes y<sub>j</sub>, then e<sub>j</sub>, then ε. Chain rule:`,
 `${F('∂ε','∂w<sub>ji</sub>')} = ${F('∂ε','∂e<sub>j</sub>')} ${F('∂e<sub>j</sub>','∂y<sub>j</sub>')} ${F('∂y<sub>j</sub>','∂v<sub>j</sub>')} ${F('∂v<sub>j</sub>','∂w<sub>ji</sub>')} = e<sub>j</sub> · (\u22121) · φ\u2032(v<sub>j</sub>) · y<sub>i</sub>`,
 `~Define δ<sub>j</sub> = \u2212∂ε/∂v<sub>j</sub> = e<sub>j</sub> φ\u2032(v<sub>j</sub>). Then:`,
 `Δw<sub>ji</sub> = η δ<sub>j</sub> y<sub>i</sub>`,
 `~The next steps derive each factor one at a time.`],
[`~v<sub>j</sub> is a sum, so only one term contains w<sub>ji</sub>. Differentiate:`,
 `${F('∂v<sub>j</sub>','∂w<sub>ji</sub>')} = y<sub>i</sub> \u2003 ${F('∂v<sub>j</sub>','∂y<sub>i</sub>')} = w<sub>ji</sub>`,
 `~The bias is the weight with input y<sub>0</sub> = 1, so ∂v<sub>j</sub>/∂b<sub>j</sub> = 1. The first result is the "input" factor in every weight update. The second is used later to send δ backward.`],
[`~Sigmoid: φ(v) = (1 + e<sup>\u2212v</sup>)<sup>\u22121</sup>. Power rule and chain rule:`,
 `φ\u2032(v) = \u2212(1 + e<sup>\u2212v</sup>)<sup>\u22122</sup> · (\u2212e<sup>\u2212v</sup>) = ${F('e<sup>\u2212v</sup>','(1 + e<sup>\u2212v</sup>)²')}`,
 `~Split into two fractions:`,
 `φ\u2032(v) = ${F(1,'1 + e<sup>\u2212v</sup>')} · ${F('e<sup>\u2212v</sup>','1 + e<sup>\u2212v</sup>')}`,
 `~The second fraction equals 1 \u2212 φ, because ${F('1 + e<sup>\u2212v</sup> \u2212 1','1 + e<sup>\u2212v</sup>')} = 1 \u2212 φ. So:`,
 `φ\u2032(v) = φ(v)(1 \u2212 φ(v)) = y(1 \u2212 y)`,
 `~The slope is computed from the stored output y, with no extra exponentials.`],
[`~Same as the hidden layer, with the inputs now being y<sub>j</sub>:`,
 `${F('∂v<sub>o</sub>','∂w<sub>oj</sub>')} = y<sub>j</sub> \u2003 ${F('∂v<sub>o</sub>','∂y<sub>j</sub>')} = w<sub>oj</sub>`,
 `~The second result, w<sub>oj</sub>, is exactly what carries the error back to hidden neuron j.`],
[`~Apply the sigmoid derivative from step 2 at v<sub>o</sub>:`,
 `${F('∂y<sub>o</sub>','∂v<sub>o</sub>')} = φ\u2032(v<sub>o</sub>) = y<sub>o</sub>(1 \u2212 y<sub>o</sub>)`],
[`~Start from ε = ½ e². The 2 from the power rule cancels the ½:`,
 `${F('∂ε','∂e')} = ${F(1,2)} · 2e = e`,
 `~Since e = d \u2212 y<sub>o</sub> and d is a constant:`,
 `${F('∂e','∂y<sub>o</sub>')} = \u22121 \u2003 so \u2003 ${F('∂ε','∂y<sub>o</sub>')} = \u2212e`,
 `~Meaning: if y<sub>o</sub> is below the target (e > 0), raising y<sub>o</sub> lowers ε.`],
[`~Definition of the local gradient, then the chain rule through y<sub>o</sub>:`,
 `δ<sub>o</sub> = \u2212${F('∂ε','∂v<sub>o</sub>')} = \u2212${F('∂ε','∂y<sub>o</sub>')} ${F('∂y<sub>o</sub>','∂v<sub>o</sub>')} = \u2212(\u2212e) · φ\u2032(v<sub>o</sub>)`,
 `δ<sub>o</sub> = e · φ\u2032(v<sub>o</sub>) = e · y<sub>o</sub>(1 \u2212 y<sub>o</sub>)`],
[`~A hidden neuron has no e of its own. Same definition, chain rule through y<sub>j</sub>:`,
 `δ<sub>j</sub> = \u2212${F('∂ε','∂v<sub>j</sub>')} = \u2212${F('∂ε','∂y<sub>j</sub>')} φ\u2032(v<sub>j</sub>)`,
 `~y<sub>j</sub> affects ε only through the output neuron (v<sub>o</sub> contains w<sub>oj</sub> y<sub>j</sub>):`,
 `${F('∂ε','∂y<sub>j</sub>')} = ${F('∂ε','∂e')} ${F('∂e','∂y<sub>o</sub>')} ${F('∂y<sub>o</sub>','∂v<sub>o</sub>')} ${F('∂v<sub>o</sub>','∂y<sub>j</sub>')} = e(\u22121)φ\u2032(v<sub>o</sub>) w<sub>oj</sub> = \u2212δ<sub>o</sub> w<sub>oj</sub>`,
 `~Substitute back:`,
 `δ<sub>j</sub> = φ\u2032(v<sub>j</sub>) δ<sub>o</sub> w<sub>oj</sub>`,
 `~With several next-layer neurons k, y<sub>j</sub> feeds all of them, so the contributions add: δ<sub>j</sub> = φ\u2032(v<sub>j</sub>) Σ<sub>k</sub> δ<sub>k</sub> w<sub>kj</sub>. Use the old weights, before any update.`],

function drawNet(c,s,st){

    h+=`<text class="val" x="${x}" y="${y+dy}">${l1}</text><text class="val" x="${x}" y="${y+dy+14}">${l2}</text>`;

    +`<p class="dt">y<sub>${n}</sub> affects ε only through the output neuron, so follow that path:</p>`
    +q(`${F('∂ε','∂y<sub>'+n+'</sub>')} = ${F('∂ε','∂e')} · ${F('∂e','∂y<sub>o</sub>')} · ${F('∂y<sub>o</sub>','∂v<sub>o</sub>')} · ${F('∂v<sub>o</sub>','∂y<sub>'+n+'</sub>')}`)

  +Qd('\u03c6(v) = max(0, v) = v for v &gt; 0, and 0 for v \u2264 0')
  +Td('Differentiate each piece:')
  +Qd('\u03c6\u2032(v) = '+F('d','dv')+' v = 1 for v &gt; 0 \u2003and\u2003 \u03c6\u2032(v) = '+F('d','dv')+' 0 = 0 for v &lt; 0')
  +Td('At v = 0 the two slopes disagree, so the derivative does not exist there. In practice we choose \u03c6\u2032(0) = 0 (any value in [0, 1] is a valid subgradient); v is almost never exactly 0.')
  +Td('Backprop, hidden neuron: ReLU acts as a gate on the incoming error.')
  +Qd('\u03b4<sub>j</sub> = \u03c6\u2032(v<sub>j</sub>) \u03a3<sub>k</sub> \u03b4<sub>k</sub> w<sub>kj</sub> = \u03a3<sub>k</sub> \u03b4<sub>k</sub> w<sub>kj</sub> if v<sub>j</sub> &gt; 0, and 0 if v<sub>j</sub> &lt; 0')
  +Td('An active neuron passes the error back with no shrinking factor, so gradients do not vanish for positive inputs. A neuron stuck at v &lt; 0 gets \u03b4 = 0 and stops learning (the \u201cdying ReLU\u201d problem). Leaky ReLU uses \u03b1v for v \u2264 0, so \u03c6\u2032 = \u03b1 there. Check at v = 0.45: \u03c6 = 0.45 and \u03c6\u2032 = 1.'))
+S3('err','Side by side',
  '<div style="overflow-x:auto"><table><tr><th></th><th>\u03c6(v)</th><th>\u03c6\u2032(v)</th><th>Hidden \u03b4<sub>j</sub></th></tr>'
  +'<tr><td>Logistic</td><td>'+F(1,'1 + '+E(M+'av'))+'</td><td>a\u03c6(1 \u2212 \u03c6)</td><td>a y(1 \u2212 y) \u03a3\u03b4w</td></tr>'
  +'<tr><td>Tanh</td><td>a tanh(bv)</td><td>'+F('b','a')+'(a² \u2212 \u03c6²)</td><td>'+F('b','a')+'(a² \u2212 y²) \u03a3\u03b4w</td></tr>'
  +'<tr><td>ReLU</td><td>max(0, v)</td><td>1 if v &gt; 0, else 0</td><td>\u03a3\u03b4w if v &gt; 0, else 0</td></tr></table></div>'
  +Td('For any of them the output neuron uses \u03b4<sub>j</sub> = e<sub>j</sub>\u03c6\u2032(v<sub>j</sub>) and every weight update is still \u0394w = \u03b7 \u00b7 \u03b4 \u00b7 input. Only \u03c6\u2032 changes.'));
$('v3').addEventListener('input',drawAct);
$('v3').addEventListener('click',e=>{const b=e.target.closest('#actPick button');if(!b)return;af=+b.dataset.f;
  document.querySelectorAll('#actPick button').forEach(x=>x.setAttribute('aria-selected',x===b));drawAct();});
render();renderC2();drawAct();
</script>
